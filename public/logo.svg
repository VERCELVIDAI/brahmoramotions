    <!-- Second Part: MOTIONS -->
    <text x="190" y="30" font-family="'Syne', 'Inter', system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" letter-spacing="0.18em" fill="#171717">MOTIONS</text>
    <!-- Subtitle Category Tag -->
    <text x="1" y="48" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.28em" fill="#707070">CREATIVE MEDIA &amp; TECHNOLOGY STUDIO</text>
    <!-- Yellow Horizon Accent Line -->
    <rect x="290" y="44" width="24" height="2" rx="1" fill="#FFD400"/>
  </g>
